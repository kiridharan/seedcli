# seedcli Configuration
# Generated by seedcli init

version: "1.0"

# Database connection settings
database:
  # Adapter: postgres, sqlite
  adapter: postgres

  # Connection URL (preferred)
  url: "postgres://user:password@localhost:5432/database?sslmode=disable"

  # Or use individual settings:
  # host: localhost
  # port: 5432
  # user: postgres
  # password: secret
  # database: myapp
  # ssl_mode: disable

  # Connection pool
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

  # Schema (PostgreSQL)
  schema: public

# Seeding behavior
seeding:
  # Default rows per table
  default_rows: 10

  # Batch size for inserts
  batch_size: 100

  # Random seed for reproducible data (0 = random)
  seed: 0

  # Skip errors and continue
  skip_errors: false

  # Truncate tables before seeding
  truncate: false

  # Disable FK checks during seeding
  disable_foreign_keys: false

  # Conflict handling: skip, update, replace, error
  on_conflict: error

  # Tables to exclude
  exclude:
    - schema_migrations
    - ar_internal_metadata

  # Tables to include (if set, only these are seeded)
  # include:
  #   - users
  #   - orders

# Data generation settings
data_generation:
  # Locale for fake data
  locale: en_US

  # Probability of NULL for nullable fields (0.0 - 1.0)
  null_probability: 0.3

  # Custom field patterns
  # field_patterns:
  #   email_pattern:
  #     pattern: "*email*"
  #     generator: email
  #   status_pattern:
  #     pattern: "*status*"
  #     generator: choice
  #     params:
  #       choices: [active, inactive, pending]

# Logging configuration
logging:
  # Level: debug, info, warn, error
  level: info

  # Log to file in .logseed directory
  to_file: true

  # Log to console
  to_console: true

  # JSON format for logs
  json: false

  # Include timestamps
  timestamp: true

  # Max log file size (MB)
  max_size: 10

  # Number of log files to keep
  max_backups: 5

# Plugin configuration
plugins:
  # Plugin directory
  directory: .seedcli/plugins

  # Enabled plugins
  enabled: []

  # Plugin-specific settings
  # settings:
  #   my-plugin:
  #     option1: value1

# Table-specific overrides
# tables:
#   users:
#     rows: 50
#     columns:
#       role:
#         values: [admin, user, guest]
#       password:
#         generator: password
#         params:
#           length: 16
#
#   orders:
#     rows: 100
#     before_sql: "SET session_replication_role = replica;"
#     after_sql: "SET session_replication_role = DEFAULT;"
