<svg
  width="360"
  height="120"
  viewBox="0 0 360 120"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="seed logo"
>
  <!-- Transparent background -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Orange Seed Icon -->
  <g transform="translate(20,30)">
    <ellipse cx="26" cy="30" rx="16" ry="22" fill="#f97316"/>
    <path
      d="M26 10 C26 -4, 50 -2, 52 12"
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>

  <!-- Text: seed -->
  <text
    x="90"
    y="78"
    font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, monospace"
    font-size="56"
    font-weight="900"
    fill="#ffffff"
    letter-spacing="1"
  >
    seed
  </text>

  <!-- Accent underline -->
  <rect
    x="92"
    y="86"
    width="120"
    height="6"
    rx="3"
    fill="#f97316"
  />
</svg>
