<svg
  width="420"
  height="120"
  viewBox="0 0 420 120"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="seedcli logo"
>
  <!-- Background (transparent) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Seed Icon -->
  <g transform="translate(20,30)">
    <!-- Seed -->
    <ellipse cx="20" cy="30" rx="14" ry="18" fill="#22c55e"/>
    
    <!-- Sprout -->
    <path
      d="M20 12 C20 -4, 44 -4, 44 12"
      fill="none"
      stroke="#16a34a"
      stroke-width="3"
      stroke-linecap="round"
    />
    <path
      d="M20 12 C20 -4, -4 -4, -4 12"
      fill="none"
      stroke="#16a34a"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>

  <!-- CLI Brackets -->
  <g transform="translate(90,32)">
    <text
      x="0"
      y="40"
      font-family="monospace"
      font-size="36"
      fill="#16a34a"
      font-weight="600"
    >
      &gt;
    </text>
  </g>

  <!-- Text -->
  <text
    x="130"
    y="75"
    font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, monospace"
    font-size="42"
    font-weight="700"
    fill="#0f172a"
    letter-spacing="-1"
  >
    seed
  </text>

  <text
    x="230"
    y="75"
    font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, monospace"
    font-size="42"
    font-weight="700"
    fill="#16a34a"
    letter-spacing="-1"
  >
    cli
  </text>
</svg>
